name: Build and publish Handbook Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reader build dependencies
        run: python -m pip install -r requirements-hub.txt
      - name: Rebuild reader from Markdown and JavaScript
        run: python AGGIORNA-HUB.py
      - name: Prepare public static files (only docs and examples)
        run: |
          mkdir -p _site
          cp index.html APRI-HANDBOOK.html _site/
          cp -R handbooks esempi recipes _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
